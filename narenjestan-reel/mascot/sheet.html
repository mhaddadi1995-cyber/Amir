<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lalezar;src:url(../fonts/lalezar-arabic-400-normal.woff2)}
body{margin:0;width:1800px;height:1260px;background:radial-gradient(circle at 50% 40%,#fff6e6,#f3e2c4);font-family:Lalezar;direction:rtl}
h1{margin:0;padding:40px 0 0;text-align:center;font-weight:400;font-size:86px;color:#2c4515}h1 span{color:#f68b23}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 0;padding:10px 60px}
.c{text-align:center}.c div{width:420px;height:440px;margin:0 auto}.c p{margin:-6px 0 0;font-size:46px;color:#2c4515}
</style></head><body><h1>آشنا شو: <span>نارنجی</span> 🍊</h1><div class="g" id="g"></div>
<script src="narenji.js"></script><script>
[['neutral','معمولی'],['happy','خوشحال'],['surprised','شگفت‌زده'],['sad','ناراحت (بهم میگن کالی!)'],['angry','جدی / مبارزه'],['wink','چشمک']].forEach(([k,l])=>{
 document.getElementById('g').insertAdjacentHTML('beforeend',`<div class="c"><div>${narenjiSVG(k)}</div><p>${l}</p></div>`)});
</script></body></html>

<style>

 <div class="pill" id="p1"><span>💬 عددتو کامنت کن</span></div>

 <div id="brand"><div style="white-space:nowrap">حداقل چاییت اصل باشه 😉</div><div style="white-space:nowrap"><b>چای بهاره‌ی گیلان</b></div></div>
 <div id="logo"></div><div id="handle">@tarebar_narenjestan</div></div>

</div>
<script src="../gsap.min.js"></script><script src="../logo.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function rng(s){return()=>((s=(s*1664525+1013904223)>>>0)/4294967296)}
const SFX=[];window.SFX=SFX;const sfx=(n,t,g=1)=>SFX.push({name:n,t:+t.toFixed(3),gain:g});
$('#logo').innerHTML=window.LOGO_SVG;
// ---- estekan geometry (kamar-barik), local coords, rim y=-160, bottom y=150
const GO='M-80,-160 C-80,-110 -46,-60 -40,-10 C-36,30 -78,70 -82,110 C-84,135 -70,150 -50,152 L50,152 C70,150 84,135 82,110 C78,70 36,30 40,-10 C46,-60 80,-110 80,-160 Z';
const GI='M-72,-156 C-72,-108 -39,-60 -33,-10 C-29,30 -70,70 -74,110 C-76,132 -64,145 -46,146 L46,146 C64,145 76,132 74,110 C70,70 29,30 33,-10 C39,-60 72,-108 72,-156 Z';
$('#gout').setAttribute('d',GO);$('#gin').setAttribute('d',GI);
// ---- background (wood + bokeh)
(function(){const c=$('#bg'),x=c.getContext('2d'),R=rng(3);const g=x.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#24120a');g.addColorStop(.6,'#3a1f0f');g.addColorStop(1,'#1b0c05');x.fillStyle=g;x.fillRect(0,0,1080,1920);
 for(let i=0;i<46;i++){x.strokeStyle=`rgba(${80+R()*40},${40+R()*20},${15},${.12+R()*.12})`;x.lineWidth=2+R()*6;x.beginPath();const y=R()*1920;x.moveTo(0,y);x.bezierCurveTo(360,y+R()*60-30,720,y+R()*60-30,1080,y+R()*40-20);x.stroke();}
 for(let i=0;i<14;i++){const X=R()*1080,Y=R()*900,r=40+R()*120,gg=x.createRadialGradient(X,Y,0,X,Y,r);gg.addColorStop(0,`rgba(255,${170+R()*60},90,${.10+R()*.12})`);gg.addColorStop(1,'rgba(255,190,90,0)');x.fillStyle=gg;x.fillRect(X-r,Y-r,2*r,2*r);}
 const v=x.createRadialGradient(540,900,300,540,960,1200);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=v;x.fillRect(0,0,1080,1920);})();
// ---- mini estekan for illustrations
const est=(x,y,s,fill=0.75,extra='')=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="168" rx="150" ry="30" fill="#e9dcc6" stroke="#b9a586" stroke-width="5"/>
 <clipPath id="c${x}${y}"><path d="${GI}"/></clipPath><g clip-path="url(#c${x}${y})"><rect x="-120" y="${150-300*fill}" width="240" height="${300*fill}" fill="url(#teaG)"/></g>
 <path d="${GO}" fill="url(#glassG)" stroke="#fff" stroke-opacity=".75" stroke-width="5"/>${extra}</g>`;
const ITEMS=[
 ['تا صبح <b>چایی</b> نخوری،<br>چشات باز نمیشه 😵',`
  <g transform="translate(400 330)"><circle r="190" fill="#f6eddc" stroke="#6b3a17" stroke-width="16"/>
  <circle cx="-150" cy="-170" r="60" fill="#e0662a" stroke="#6b3a17" stroke-width="12"/><circle cx="150" cy="-170" r="60" fill="#e0662a" stroke="#6b3a17" stroke-width="12"/>
  <path d="M-120,200 l-40,60 M120,200 l40,60" stroke="#6b3a17" stroke-width="16" stroke-linecap="round"/>
  <path d="M-80,-20 q30,25 60,0 M20,-20 q30,25 60,0" stroke="#6b3a17" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M-40,70 q40,-25 80,0" stroke="#6b3a17" stroke-width="12" fill="none" stroke-linecap="round"/>
  <text x="0" y="150" text-anchor="middle" font-family="Lalezar" font-size="64" fill="#b5401a" direction="ltr">7:00</text>
  <text x="200" y="-200" font-family="Lalezar" font-size="80" fill="#ffc93c">Zz</text></g>`,'shake'],
 ['«یه چایی بریز»<br>جای <b>سلامته</b> 😂',`
  <g transform="translate(400 330)"><g transform="translate(60 -150)"><rect x="-260" y="-70" width="420" height="130" rx="50" fill="#fff4e0" opacity=".45"/>
  <text x="-50" y="22" text-anchor="middle" font-family="Vazir" font-weight="900" font-size="64" fill="#2a160b">سلام 👋</text><path id="strike" d="M-230,0 L130,0" stroke="#d6452b" stroke-width="14" stroke-linecap="round"/></g>
  <g id="bub2" transform="translate(-40 60)"><rect x="-260" y="-80" width="560" height="150" rx="60" fill="#ffc93c"/>
  <text x="20" y="25" text-anchor="middle" font-family="Vazir" font-weight="900" font-size="66" fill="#2a160b">یه چایی بریز ☕</text></g></g>`,'bub'],
 ['یه استکان <b>مخصوص</b> داری<br>که کسی حق نداره بهش دست بزنه 🚫',
  est(400,370,1.25,.8,`<g transform="translate(110 -60) rotate(12)"><rect x="-10" y="-40" width="230" height="86" rx="14" fill="#fff4e0" stroke="#d6452b" stroke-width="6"/><text x="105" y="18" text-anchor="middle" font-family="Vazir" font-weight="900" font-size="44" fill="#d6452b">مال منه!</text></g>`),'pop'],
 ['نصفه‌شب چایی می‌خوری و میگی<br>«<b>رو من اثر نداره</b>» 😎',`
  <g transform="translate(220 140)"><path d="M60,-90 A110,110 0 1,0 150,60 A85,85 0 1,1 60,-90 Z" fill="#ffe08a"/><text x="250" y="-60" font-size="40" fill="#fff">✦</text><text x="-120" y="40" font-size="30" fill="#fff">✦</text></g>
  <g transform="translate(600 120)"><rect x="-120" y="-60" width="240" height="120" rx="20" fill="#120905" stroke="#e0662a" stroke-width="6"/><text x="0" y="22" text-anchor="middle" font-family="Lalezar" font-size="76" fill="#ff5a3a" direction="ltr">00:00</text></g>`+est(400,450,1.05,.85),'pop'],
 ['با <b>پیتزا</b> هم<br>چایی می‌خوری! 🍕☕',`
  <g transform="translate(220 380) rotate(-12)"><path d="M0,-230 L170,150 Q0,200 -170,150 Z" fill="#f2b24a" stroke="#a5591c" stroke-width="10"/><path d="M-170,150 Q0,200 170,150 Q0,250 -170,150 Z" fill="#c9792e"/>
  <circle cx="-20" cy="0" r="34" fill="#c0392b"/><circle cx="60" cy="90" r="30" fill="#c0392b"/><circle cx="-80" cy="110" r="28" fill="#c0392b"/><circle cx="20" cy="-110" r="24" fill="#c0392b"/></g>
  <text x="430" y="400" text-anchor="middle" font-family="Lalezar" font-size="120" fill="#ffc93c">+</text>`+est(620,360,1.0,.8),'pop'],
 ['چایی <b>یخ‌کرده</b> رو هم<br>حروم نمی‌کنی، سر می‌کشی 🥶',
  est(400,370,1.25,.7,`<g fill="#d9f2ff" stroke="#fff" stroke-width="4" opacity=".9"><rect x="-40" y="-40" width="50" height="50" rx="8" transform="rotate(15)"/><rect x="10" y="0" width="46" height="46" rx="8" transform="rotate(-20)"/></g>`)+
  `<g fill="#bfe8ff" font-size="70"><text x="120" y="160">❄</text><text x="610" y="240">❄</text><text x="170" y="520">❄</text><text x="640" y="560">❄</text></g>`,'pop'],
 ['وقتی چایی <b>تموم میشه</b>،<br>حس عزا داری 😭',`
  <g transform="translate(400 380) rotate(-18)"><ellipse cx="0" cy="40" rx="190" ry="150" fill="#f6eddc" stroke="#6b3a17" stroke-width="12"/>
  <path d="M-30,-110 Q0,-150 30,-110" fill="#e0662a" stroke="#6b3a17" stroke-width="10"/><ellipse cx="0" cy="-110" rx="90" ry="22" fill="#e0662a" stroke="#6b3a17" stroke-width="10"/>
  <path d="M170,10 C260,-20 300,-80 330,-120" stroke="#6b3a17" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M170,10 C260,-20 300,-80 330,-120" stroke="#f6eddc" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M-180,0 C-260,-30 -250,120 -170,100" stroke="#6b3a17" stroke-width="16" fill="none"/>
  <path d="M-90,30 q20,-20 40,0 M50,30 q20,-20 40,0" stroke="#6b3a17" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M-40,110 q40,-30 80,0" stroke="#6b3a17" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M-70,50 q-12,30 0,40 q12,-10 0,-40" fill="#7cc8ff"/></g>
  <g id="drop" transform="translate(712 240)"><path d="M0,0 q-14,26 0,34 q14,-8 0,-34" fill="#b5401a"/></g>`,'drop'],
];
const box=$('#items');
ITEMS.forEach((it,i)=>{box.insertAdjacentHTML('beforeend',`<div class="item" id="it${i}"><div class="num">${'۱۲۳۴۵۶۷'[i]}</div>
 <svg class="ill" viewBox="0 0 800 690">${it[1]}</svg><div class="txt disp">${it[0]}</div></div>`);});
// ---- timeline
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
const G=$('#glass');
const setGlass=(x,y,s)=>`translate(${x} ${y}) scale(${s})`;
const gs={x:540,y:900,s:1.9};
G.setAttribute('transform',setGlass(gs.x,gs.y,gs.s));
const upd=()=>G.setAttribute('transform',setGlass(gs.x,gs.y,gs.s));
const fill={v:0};const updFill=()=>{const h=296*fill.v;$('#teaFill').setAttribute('y',150-h);$('#teaFill').setAttribute('height',h);$('#teaTop').setAttribute('cy',150-h);$('#teaTop').setAttribute('rx',h>2?Math.max(36,Math.min(74,40+Math.abs(Math.sin((150-h)/90))*34)):0);};
// HOOK 0-2.4
tl.fromTo(gs,{s:0},{s:1.9,duration:.5,ease:'back.out(1.8)',onUpdate:upd},0);sfx('pop',0,.8);
tl.fromTo('#hookT .w',{y:60,scale:.6,autoAlpha:0},{y:0,scale:1,autoAlpha:1,duration:.4,stagger:.06,ease:'back.out(2.2)'},.1);sfx('swish',.1,.5);
tl.fromTo('#hookS',{scale:.3,autoAlpha:0},{scale:1,autoAlpha:1,duration:.35,ease:'back.out(3)'},1.1);sfx('boing',1.1,.7);
tl.to('#hookS',{scale:1.08,duration:.15,yoyo:true,repeat:3},1.5);
tl.to('#hook',{autoAlpha:0,duration:.25},2.15);
tl.to(gs,{x:190,y:340,s:.95,duration:.55,ease:'power3.inOut',onUpdate:upd},2.1);sfx('whoosh',2.05,.7);
tl.to('#mlabel,#mcount',{opacity:1,duration:.3},2.5);
// ITEMS
const T0=2.6,D=2.85;
ITEMS.forEach((it,i)=>{const t=T0+i*D,s='#it'+i;
 tl.set(s,{autoAlpha:1},t);
 tl.fromTo(s+' .num',{scale:0,rotation:-120},{scale:1,rotation:0,duration:.45,ease:'back.out(2.6)'},t);
 tl.fromTo(s+' .ill',{scale:.6,autoAlpha:0,y:60,transformOrigin:'50% 60%'},{scale:1,autoAlpha:1,y:0,duration:.5,ease:'back.out(1.7)'},t+.05);
 tl.fromTo(s+' .txt',{y:50,autoAlpha:0},{y:0,autoAlpha:1,duration:.4},t+.25);
 tl.to(fill,{v:(i+1)/7,duration:.6,ease:'power2.out',onUpdate:updFill},t+.3);
 tl.call(()=>{},null,t);tl.set('#mcount',{textContent:(i+1)+'/7'},t+.3);
 tl.fromTo('#mcount',{scale:1.6},{scale:1,duration:.3,ease:'back.out(3)'},t+.3);
 sfx('tick',t,.8);sfx('fill',t+.3,.5);sfx('pop',t+.05,.6);
 if(it[2]==='shake')tl.to(s+' .ill',{rotation:3,duration:.06,yoyo:true,repeat:9,transformOrigin:'50% 50%',ease:'none'},t+.6);
 if(it[2]==='bub'){tl.fromTo(s+' #strike',{scaleX:0,transformOrigin:'0% 50%'},{scaleX:1,duration:.3},t+.8);tl.fromTo(s+' #bub2',{scale:0,transformOrigin:'50% 50%'},{scale:1,duration:.4,ease:'back.out(2.5)'},t+1.1);sfx('swish',t+.8,.5);sfx('pop',t+1.1,.7);}
 if(it[2]==='drop')tl.fromTo(s+' #drop',{y:0,autoAlpha:1},{y:260,autoAlpha:0,duration:.9,ease:'power2.in'},t+.8);
 tl.to(s,{autoAlpha:0,duration:.2},t+D-.15);
});
const TR=T0+7*D; // ~22.55 result
// overflow splash
tl.to(fill,{v:1.06,duration:.4,onUpdate:updFill},TR-.3);
tl.to(gs,{x:540,y:420,s:1.1,duration:.5,ease:'power3.inOut',onUpdate:upd},TR);
tl.to('#mlabel,#mcount',{opacity:0,duration:.2},TR);
tl.fromTo('#flash',{opacity:0},{opacity:.4,duration:.06,immediateRender:false},TR+.4).to('#flash',{opacity:0,duration:.3},TR+.46);sfx('splash',TR+.35,.9);
tl.set('#res',{autoAlpha:1},TR+.3);
tl.fromTo('#resT',{scale:.5,autoAlpha:0},{scale:1,autoAlpha:1,duration:.4,ease:'back.out(2.5)'},TR+.35);
['#lv1','#lv2','#lv3'].forEach((l,k)=>{tl.fromTo(l,{x:-300,autoAlpha:0},{x:0,autoAlpha:1,duration:.4,ease:'back.out(1.8)'},TR+.7+k*.35);sfx('pop',TR+.7+k*.35,.7);});
tl.to('#lv3',{scale:1.06,duration:.25,yoyo:true,repeat:3,ease:'sine.inOut'},TR+2.0);sfx('ding',TR+1.4,.8);
const TC=TR+3.4;
tl.to('#res',{autoAlpha:0,duration:.25},TC-.2);
tl.to(gs,{x:540,y:900,s:1.15,duration:.5,ease:'power3.inOut',onUpdate:upd},TC-.3);
tl.set('#cta',{autoAlpha:1},TC);
tl.fromTo('#ctaQ .w',{y:60,scale:.6,autoAlpha:0},{y:0,scale:1,autoAlpha:1,duration:.4,stagger:.06,ease:'back.out(2.2)'},TC);sfx('swish',TC,.5);
tl.fromTo('#p1',{scale:.4,autoAlpha:0},{scale:1,autoAlpha:1,duration:.4,ease:'back.out(2.5)'},TC+.9);sfx('pop',TC+.9,.8);
tl.fromTo('#p2',{scale:.4,autoAlpha:0},{scale:1,autoAlpha:1,duration:.4,ease:'back.out(2.5)'},TC+1.3);sfx('pop',TC+1.3,.8);
tl.fromTo('#brand,#logo,#handle',{y:30,autoAlpha:0},{y:0,autoAlpha:1,duration:.4,stagger:.1},TC+1.9);sfx('chime',TC+1.9,.6);
tl.to('#p2',{scale:1.06,duration:.3,yoyo:true,repeat:5,ease:'sine.inOut'},TC+2.4);
const END=+(TC+5.6).toFixed(2);tl.set({}, {}, END);
// steam animation (continuous)
function steam(t){['#s1','#s2','#s3'].forEach((id,k)=>{const p=((t*0.7+k*.33)%1);const el=$(id);el.setAttribute('transform',`translate(0 ${-p*60})`);el.setAttribute('opacity',(Math.sin(p*Math.PI)).toFixed(2));});}
window.DURATION=END;
window.renderAt=t=>{tl.time(Math.min(t,END),false);updFill();upd();steam(t);};
window.ready=(async()=>{await document.fonts.load('400 100px Lalezar','چایی');await document.fonts.load('900 50px Vazir','سلام');await document.fonts.ready;window.renderAt(0);return true;})();
})();
